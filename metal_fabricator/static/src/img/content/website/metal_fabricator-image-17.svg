<svg xmlns="http://www.w3.org/2000/svg"
     width="100%"
     height="auto"
     preserveAspectRatio="xMidYMid meet"
     style="display:block; max-width:945px; margin-left:auto; margin-right:auto;"
     viewBox="0 0 945 110"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Metalwork, Made to Measure</title>
  <desc id="desc">A welding-inspired blue line travels beneath the heading as the words are revealed in sync.</desc>

  <defs>
    <clipPath id="text-reveal">
      <rect x="0" y="0" width="0" height="110">
        <animate attributeName="width"
                 from="0" to="1040"
                 dur="2.4s"
                 begin="0s"
                 calcMode="spline"
                 keyTimes="0;1"
                 keySplines="0.2 0.8 0.2 1"
                 fill="freeze"/>
      </rect>
    </clipPath>

    <filter id="arc-glow" x="-100%" y="-300%" width="300%" height="700%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Heading: revealed at exactly the same pace as the underline -->
  <text x="8" y="71"
        fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="72"
        font-weight="700"
        letter-spacing="-2"
        clip-path="url(#text-reveal)">Metalwork, Made to Measure</text>

  <!-- Soft blue welding glow -->
  <line x1="176.5" y1="101" x2="176.5" y2="101"
        stroke="#1683FF"
        stroke-width="8"
        stroke-linecap="round"
        opacity="0.48"
        filter="url(#arc-glow)">
    <animate attributeName="x2" from="176.5" to="767.5"
             dur="2.4s" begin="0s" calcMode="spline"
             keyTimes="0;1" keySplines="0.2 0.8 0.2 1"
             fill="freeze"/>
  </line>

  <!-- Crisp blue bead -->
  <line x1="176.5" y1="101" x2="176.5" y2="101"
        stroke="#1683FF"
        stroke-width="3"
        stroke-linecap="butt">
    <animate attributeName="x2" from="176.5" to="767.5"
             dur="2.4s" begin="0s" calcMode="spline"
             keyTimes="0;1" keySplines="0.2 0.8 0.2 1"
             fill="freeze"/>
  </line>

  <!-- Small hot point at the moving weld seam -->
  <circle cx="176.5" cy="101" r="3.2" fill="#EAF5FF" filter="url(#arc-glow)">
    <animate attributeName="cx" from="176.5" to="767.5"
             dur="2.4s" begin="0s" calcMode="spline"
             keyTimes="0;1" keySplines="0.2 0.8 0.2 1"
             fill="freeze"/>
    <animate attributeName="opacity" values="0.85;1;0.75;1"
             dur="0.18s" repeatCount="indefinite"/>
  </circle>

  <!-- Brief, restrained sparks around the welding point -->
  <g fill="#B9DEFF" filter="url(#arc-glow)">
    <circle r="1.4">
      <animate attributeName="cx" values="176.5;767.5" dur="2.4s"
               begin="0s" calcMode="spline" keyTimes="0;1"
               keySplines="0.2 0.8 0.2 1" fill="freeze"/>
      <animate attributeName="cy" values="101;94;101" dur="0.32s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="0.32s"
               repeatCount="indefinite"/>
    </circle>
    <circle r="1">
      <animate attributeName="cx" values="176.5;767.5" dur="2.4s"
               begin="0s" calcMode="spline" keyTimes="0;1"
               keySplines="0.2 0.8 0.2 1" fill="freeze"/>
      <animate attributeName="cy" values="101;108;101" dur="0.25s"
               begin="0.08s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="0.25s"
               begin="0.08s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
