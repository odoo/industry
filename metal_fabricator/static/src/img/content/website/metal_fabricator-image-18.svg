<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 100"
     width="32" height="50"
     role="img"
     aria-label="Scroll">

  <rect x="9" y="3" width="46" height="76"
        rx="23"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"/>

  <path d="M32 4 V24"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"
        stroke-linecap="round"/>

  <circle cx="32" cy="18" r="3" fill="#FFFFFF">
    <animate attributeName="cy"
             values="18;34;48;18"
             dur="1.6s"
             repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values="1;1;0;0"
             dur="1.6s"
             repeatCount="indefinite"/>
  </circle>
</svg>
